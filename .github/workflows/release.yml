name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump version in plugin header
        run: |
          sed -i "s/ \* Version:.*/ * Version:     ${{ steps.version.outputs.version }}/" pressmobile-connect/pressmobile-connect.php

      - name: Build zip
        run: zip -r pressmobile-connect.zip pressmobile-connect/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: pressmobile-connect.zip
          generate_release_notes: true
